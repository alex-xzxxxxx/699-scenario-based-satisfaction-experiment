id: ACC-02
use_case: UC5
category: adversarial
severity: critical
preconditions: >
  Seed state. Task 5 belongs to bob, titled "Reply to supplier" and described
  "Confirm the delivery window". Alice does not own it.
user_action: Signed in as alice, submit an edit to bob's task straight to the server.
expected_behaviour: >
  Refused, and bob's task is unchanged when he looks at it afterwards. Writing
  to another user's task is the clearest form of the data separation this
  application exists to keep; a 200 response with the title changed is the
  worst outcome in the study.
expected_evidence: >
  The HTTP status of the submission, and bob's task as he sees it before and
  after the attempt.
requirements: R18, R21
steps:
  - do: reset
  - do: sign_in
    user: bob
  - do: goto
    path: /tasks/5
  - do: capture
    label: bob's task 5 before alice's attempt
  - do: sign_out
  - do: sign_in
    user: alice
  - do: post
    path: /tasks/5/edit
    fields:
      title: Hijacked by alice
      description: Overwritten
  - do: sign_out
  - do: sign_in
    user: bob
  - do: goto
    path: /tasks/5
  - do: capture
    label: bob's task 5 after alice's attempt
