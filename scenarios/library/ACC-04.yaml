id: ACC-04
use_case: UC5
category: adversarial
severity: critical
preconditions: >
  Seed state. Task 5 belongs to bob, is titled "Reply to supplier", and its
  status is "open". Alice does not own it.
user_action: Signed in as alice, submit a status toggle for bob's task straight to the server.
expected_behaviour: >
  Refused, and the status is still "open" when bob looks. Toggling is a write
  like any other and is covered by the same ownership rule; it is the route
  most easily forgotten, because it carries no form fields.
expected_evidence: >
  The HTTP status of the submission, and the status of bob's task before and
  after.
requirements: R24, R21
steps:
  - do: reset
  - do: sign_in
    user: bob
  - do: goto
    path: /tasks/5
  - do: capture
    label: bob's task 5 before alice's attempt, status open
  - do: sign_out
  - do: sign_in
    user: alice
  - do: post
    path: /tasks/5/toggle
  - do: sign_out
  - do: sign_in
    user: bob
  - do: goto
    path: /tasks/5
  - do: capture
    label: bob's task 5 after alice's attempt
