id: ACC-06
use_case: UC5
category: adversarial
severity: critical
preconditions: Seed state. Task 5 belongs to bob. No task has id 999999.
user_action: >
  Signed in as alice, request bob's task id and a non-existent id by the same
  routes, and compare the two responses.
expected_behaviour: >
  The two responses are indistinguishable — same status, same page, same
  message. If they differ in any way, alice can discover which task ids exist
  by trying them.
expected_evidence: >
  Both status codes and both bodies for each pair of requests, and whether
  each pair matched.
requirements: R25, R21
steps:
  - do: reset
  - do: sign_in
    user: alice
  - do: compare_responses
    path_a: /tasks/5
    path_b: /tasks/999999
  - do: compare_responses
    path_a: /tasks/5/edit
    path_b: /tasks/999999/edit
  - do: compare_responses
    method: post
    path_a: /tasks/5/toggle
    path_b: /tasks/999999/toggle
  - do: capture
    label: after the comparisons
