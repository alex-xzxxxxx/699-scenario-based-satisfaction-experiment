id: TSK-14
use_case: UC3
category: failure
severity: medium
preconditions: >
  Seed state. Alice is signed in. Task 1 is hers and is titled "Draft project
  outline".
user_action: Edit that task, clearing the title to blank, and save.
expected_behaviour: >
  Rejected. The rule that a title cannot be empty applies to editing as well
  as to creating. The task keeps its original title, and a visible message
  explains the rejection.
expected_evidence: >
  The message text, and the task's title before and after the attempt.
requirements: R10, R23
steps:
  - do: reset
  - do: sign_in
    user: alice
  - do: capture
    label: the list before the attempt
  - do: goto
    path: /tasks/1/edit
  - do: fill
    field: title
    value: ''
  - do: click
    target: save
  - do: capture
    label: the response to clearing the title
  - do: goto
    path: /tasks
  - do: capture
    label: the list after the attempt
